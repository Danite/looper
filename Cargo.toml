[package]
name = "looper"
version = "0.1.0"
edition = "2021"
description = "Static analysis tool that discovers implicit shadow dependencies in JavaScript/TypeScript codebases"
license = "MIT"
rust-version = "1.92.0"
repository = "https://github.com/Danite/looper"
homepage = "https://github.com/Danite/looper"
readme = "README.md"
keywords = ["static-analysis", "shadow-dependencies", "javascript", "typescript", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "looper"
path = "src/main.rs"

[dependencies]
oxc_parser = "0.123"
oxc_ast = "0.123"
oxc_ast_visit = "0.123"
oxc_span = "0.123"
oxc_allocator = "0.123"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ignore = "0.4"
colored = "2"
rayon = "1.10"
url = "2"
regex = "1"
serde_yaml = "0.9"
which = "8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"
